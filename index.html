<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>motivated feedback generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-blue-100 to-blue-200 flex items-center justify-center min-h-screen p-4 font-sans text-right">

    <div class="w-full max-w-3xl bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-blue-200">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-700">motivated feedback generator</h1>
        <p class="text-center text-blue-600 mb-8 leading-relaxed">
            Write any random feedback
        </p>

        <div class="mb-6">
            <label for="inputText" class="block text-blue-800 font-medium mb-2">
                Original feedback
            </label>
            <textarea
                id="inputText"
                class="w-full h-32 p-4 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 resize-none text-right"
                placeholder="Example: الكلاس ورك محلول تمام والنوتس مكتوبه بس مش لكل الاسئله....الواجب محلول صح وبالخطوات بس مش مبعوت كامل"
            ></textarea>
        </div>

        <button
            id="rephraseButton"
            class="w-full py-3 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-200 disabled:bg-blue-300"
        >
            Generate
        </button>

        <div id="error-message" class="mt-6 p-4 bg-red-100 border border-red-300 rounded-lg text-red-700 hidden">
            <p class="font-semibold">Error:</p>
            <p id="error-text"></p>
        </div>

        <div id="rephrased-output" class="mt-8 p-6 bg-blue-50 border border-blue-300 rounded-lg shadow-inner hidden">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xl font-semibold text-blue-700">After generation</h2>
                <button
                    id="copyButton"
                    class="py-1.5 px-4 bg-blue-600 text-white text-sm font-medium rounded-lg shadow-sm hover:bg-blue-700 transition duration-200"
                >
                    Copy
                </button>
            </div>
            <p id="rephrased-text" class="text-blue-900 leading-relaxed whitespace-pre-line"></p>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputTextarea = document.getElementById('inputText');
        const rephraseButton = document.getElementById('rephraseButton');
        const rephrasedOutput = document.getElementById('rephrased-output');
        const rephrasedText = document.getElementById('rephrased-text');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const copyButton = document.getElementById('copyButton');

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(rephrasedText.textContent);
                const originalLabel = copyButton.textContent;
                copyButton.textContent = 'Copied';
                setTimeout(() => {
                    copyButton.textContent = originalLabel;
                }, 1500);
            } catch (e) {
                copyButton.textContent = 'Copy failed';
                setTimeout(() => {
                    copyButton.textContent = 'Copy';
                }, 1500);
            }
        });

        // Replace this line with your Cloudflare Worker URL after creating it
        const WORKER_URL = 'https://plain-math-2511.janahussam3.workers.dev';

        rephraseButton.addEventListener('click', async () => {
            const feedback = inputTextarea.value.trim();

            if (!feedback) {
                errorMessage.classList.remove('hidden');
                errorText.textContent = 'Please write the original feedback.';
                rephrasedOutput.classList.add('hidden');
                return;
            }

            rephraseButton.disabled = true;
            rephraseButton.textContent = 'Generating...';
            errorMessage.classList.add('hidden');
            rephrasedOutput.classList.add('hidden');

            const prompt = `أنت مساعد تدريس لمادة الكيميستري. مهمتك تحويل الملاحظة الأصلية إلى رسالة تشجيعية بسيطة وودية بالعامية المصرية.

قواعد صارمة يجب الالتزام بها حرفياً:
1. استخدم نفس المصطلحات المذكورة في الملاحظة الأصلية بالظبط زي ما هي (سواء "الكلاسورك" أو "الواجب" أو غيرها). ممنوع تستبدل مصطلح بمصطلح تاني، وممنوع تستخدم كلمة عامة زي "الشغل" أو "المذاكرة" بدل الاسم المحدد المذكور في الملاحظة. الممنوع ده مش بس للاسم نفسه، لازم يشمل كل الأفعال والتعبيرات المرتبطة بيه كمان - يعني ممنوع تقول "وانت شغال" أو "وانت بتشتغل" كبديل عام، لازم تقول الفعل مربوط بالاسم المحدد بالظبط زي "وانت بتحل الكلاسورك" مثلاً. ممنوع تضيف أي مصطلح مش مذكور نصاً في الملاحظة. مثلاً لو الملاحظة اتكلمت عن "الكلاسورك" بس، متكتبش "الواجب" ولا "الشغل" ولا "شغال" كبديل عام، ولو اتكلمت عن الاتنين، اذكر الاتنين زي ما هما مكتوبين بالظبط.
2. ممنوع تضيف أي كلمة أو موضوع مش مذكور نصاً في الملاحظة الأصلية (زي "مسائل" أو أي حاجة تانية). لو مش موجود في الملاحظة، متكتبوش.
3. ممنوع تختصر أو تحذف أي نقطة موجودة في الملاحظة الأصلية - لازم كل النقاط تتذكر في الرسالة، من غير ما تتحذف أو تتدمج في بعض وتضيع. ممنوع تنسخ نفس الجمل والألفاظ حرفياً زي ما هي مكتوبة في الملاحظة الأصلية - لازم تتعاد صياغة كل نقطة فعلياً بكلمات مختلفة مع الحفاظ على نفس المعنى بالظبط. ده معناه إعادة صياغة حقيقية وواضحة، مش مجرد تغيير كلمة أو اتنين وسيب باقي الجملة زي ما هي - لو حد قارن الملاحظة الأصلية بالرسالة الناتجة لازم يلاحظ إن الأسلوب والصياغة اتغيرت فعلاً حتى لو المعنى واحد. لو في الملاحظة الأصلية غلطة إملائية واضحة (زي حرف متكرر بالغلط أو خطأ كتابي بسيط)، صححها تلقائياً في الرسالة من غير ما تنسخها زي ما هي، بشرط المعنى يفضل زي ما هو بالظبط. بعد ما تغطي كل النقط، ضيف نصيحة أو اتنين (حسب عدد النقط ومحتواها) حقيقية ومفيدة فعلاً، مبنية على نفس النقط المذكورة في الملاحظة بالظبط (مش نصيحة عامة أو جاهزة ومش موضوع جديد). النصيحة لازم تكون عملية ومحددة وقابلة للتنفيذ فعلاً - يعني تقول للطالب يعمل إيه بالظبط، مش جملة عامة وضعيفة زي "حاول تحسن" أو "ركز أكتر" من غير تفاصيل. النصيحة لازم تتفصّل كل مرة على حسب تفاصيل الملاحظة اللي قدامك، مش نفس الصياغة أو نفس الفكرة الجاهزة بتتكرر في كل الحالات - لو اتنين ملاحظات مختلفين في التفاصيل، النصيحة المفروض تختلف هي كمان. من ضمن الأفكار اللي ممكن تستخدمها لما تناسب السياق (مش دايماً ولا بنفس الصياغة): لو الملاحظة ذكرت سؤال أو أكتر اتحل غلط، أو ذكرت إن الطالب مش بيراجع حله بعدين، النصيحة المناسبة هنا إنك ترجع تتفرج على فيديو حل الدكتور بتركيز عشان تفهم سبب أي غلطة بالظبط أو تتأكد من صحة حلك، وبعد كده تحاول تحل نفس السؤال أو تراجع إجابتك تاني بنفسك من غير ما تشوف الحل الأول، عشان تتأكد إنك فهمت واكتسبت مهارة الحل صح. دي فكرة واحدة بس من أفكار كتير ممكنة، وتناسب تحديداً حالة "سؤال محلول غلط" أو "مش بيراجع الحل" - في حالات تانية النصيحة لازم تتغير حسب طبيعة المشكلة المذكورة في الملاحظة. اكتب النصيحة (أو النصيحتين) كجمل عادية جوه السياق، من غير ما تحطها تحت عنوان أو تيتل زي "نصيحة ليك:" أو أي تسمية مشابهة.
4. ممنوع أي كلمة أو صفة أو فعل بيحط "تصنيف" سلبي أو حكم سلبي على شغل الطالب أو مجهوده، حتى لو مش قاسية أو جارحة قوي وحتى لو مكتوبة بالظبط كده في الملاحظة الأصلية. ده يشمل كل الألفاظ المتوقعة والغير متوقعة زي (على سبيل المثال لا الحصر): "وحش جدا"، "بشع"، "فظيع"، "كارثة"، "مصيبة"، "زفت"، "زبالة"، "خرابيط"، "متخربط"، "مخربط"، "متلخبط"، "مبهدل"، "بهدلة"، "فوضى"، "عشوائي"، "مش مضبوط"، "مش مرتب"، "مهمل"، "متسيب"، "ضايع"، "تعبان"، "هابط"، "خربان"، "بايظ"، "فاشل"، "رديء"، "سيء قوي"، "تافه"، "سخيف"، "غبي"، "كسلان"، أو أي فعل/تشبيه بنفس المعنى زي "بتكرته" أو "بتخربطه" أو "بتضيعه". القاعدة عامة ومش مقصورة على الكلمات دي بس - أي كلمة تانية بتحكم سلبياً على الشغل أو تقلل من قيمته لازم تتعامل بنفس الطريقة حتى لو مش موجودة في القائمة. بدل ما تكتب أي صفة سلبية من دي كحكم على الشغل، حوّلها لوصف بناء بيقول إيه اللي محتاج يتحسن وإزاي (مثلاً بدل "الكلاسورك عشوائي" اكتب حاجة زي "محتاج ترتب خطواتك أكتر")، من غير ما تستخدم أي لفظ بيحكم على الشغل أو يحط الطالب في موقف سلبي.
5. خلي الكلام هادي من غير مبالغة في العاطفة (من غير يا بطلة أو قلوب كتير)، يكفي يكون فيه تشجيع بسيط زي "برافو عليك".
6. ابدأ الرسالة على طول بعبارة تشجيع من غير أي ترحيب زي "أهلاً بيك". العبارة لازم تكون صادقة ومتناسبة مع محتوى الملاحظة: لو في الملاحظة حاجة إيجابية فعلاً (زي حل صح أو مجهود واضح) ابدأ بـ"برافو عليك" أو حاجة قريبة منها. لو الملاحظة كلها سلبية ومفيهاش أي حاجة إيجابية، ممنوع تستخدم "برافو عليك" أو أي مدح لحاجة مش موجودة - ابدأ بدل كده بعبارة تشجيع عامة على الاهتمام والمتابعة زي "مبسوطين إنك بعت الكلاسورك" أو "مبسوطين إنك مهتم بحل الكلاسورك ودا هيفرق معاك جدا في اكتساب مهارة الحل" أو "مبسوطين بالتزامك بالكلاسورك" أو "برافو عليك إنك بعت الكلاسورك". الأمثلة دي مجرد أفكار للإلهام مش قائمة ثابتة تختار منها كل مرة - لازم تولّد صياغة جديدة ومختلفة في كل مرة بدون ما تتقيد بعدد محدود من الجمل. الاختلاف المطلوب مش بس تغيير كلمة أو اتنين، لازم يكون في تركيب الجملة وترتيب الكلام وطولها كمان (جملة قصيرة مرة، وأطول شوية مرة تانية، وترتيب مختلف للكلمات)، مش نفس القالب بيتكرر بمرادفات مختلفة. يعني لو اتكررت نفس الملاحظة أو ملاحظات متشابهة ألف مرة، العبارة الافتتاحية المفروض تختلف في صياغتها وتركيبها في كل مرة من غير ما تدور حوالين نفس الجمل بالظبط.
7. الرسالة موجهة للطالب مباشرة وبتتكلم معاه، مش عنه. استخدم دايماً ضمير المخاطب (انت/إنت) في كل الرسالة، حتى لو الملاحظة الأصلية مكتوبة بصيغة الغائب (زي "الطالب بيحل") - حوّلها لصيغة المخاطب المباشر (زي "انت بتحل").
8. ممنوع تماماً استخدام علامة الشرطة (-) في أول أي سطر، وممنوع تحط كل جملة في سطر لوحدها. اكتب الرسالة كفقرة أو فقرتين متصلتين بشكل طبيعي، الجمل مربوطة ببعض عادي زي أي كلام طبيعي، من غير تقسيم كل فكرة لسطر منفصل أو نقطة منفصلة.
9. لو الملاحظة فيها نقط سلبية، اختم الرسالة بجملة ثقة وتفاؤل في المستقبل بضمير الجمع "إحنا" مش "أنا"، وبضمير المخاطب "انت/ك" مش الغائب (زي "إحنا واثقين فيك" أو "إحنا واثقين إن الكلاسورك اللي جاي هيكون أحسن")، أو "بالتوفيق ليك" مع تأكيد إن إحنا واثقين إنك هتظبط اللي اتكلمنا فيه في الكلاسورك اللي جاي. كلمة "الكلاسورك" ممنوع تتجمع أو تتكتب "كلاسوركات" - دايماً مفرد "الكلاسورك اللي جاي" أو "المرة الجاية". الصياغة بتاعة الجملة دي لازم تتنوع كل مرة، مش بس تغيير كلمة أو مرادف، لازم يختلف تركيب الجملة وترتيبها وطولها كل مرة، متبقاش نفس الكلام أو نفس الترتيب ثابت في كل الرسايل.
10. اجعل الرسالة قصيرة نسبياً، ودية، وبنهاية مشجعة عادية.

الملاحظة الأصلية هي: ${feedback}
المخرج: `;

            try {
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }]
                };

                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const rephrased = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (rephrased) {
                    rephrasedOutput.classList.remove('hidden');
                    rephrasedText.textContent = rephrased.trim();
                } else {
                    errorMessage.classList.remove('hidden');
                    errorText.textContent = 'Please try again. Eng.Jana is upgrading it now';
                }
            } catch (e) {
                errorMessage.classList.remove('hidden');
                errorText.textContent = 'Unexpected error. Please check your internet connection and try again.';
            } finally {
                rephraseButton.disabled = false;
                rephraseButton.textContent = 'Generate another message';
            }
        });
    });
    </script>
</body>
</html>
