<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>motivated feedback generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 via-blue-100 to-blue-200 flex items-center justify-center min-h-screen p-4 font-sans text-right">

    <div class="w-full max-w-3xl bg-white/95 backdrop-blur-sm p-6 rounded-2xl shadow-xl border border-blue-200">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-700">motivated feedback generator</h1>
        <p class="text-center text-blue-600 mb-8 leading-relaxed">
            Write any random feedback
        </p>

        <div class="mb-6">
            <label for="inputText" class="block text-blue-800 font-medium mb-2">
                Original feedback
            </label>
            <textarea
                id="inputText"
                class="w-full h-32 p-4 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 resize-none text-right"
                placeholder="Example: الكلاس ورك محلول تمام والنوتس مكتوبه بس مش لكل الاسئله....الواجب محلول صح وبالخطوات بس مش مبعوت كامل"
            ></textarea>
        </div>

        <button
            id="rephraseButton"
            class="w-full py-3 px-4 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-200 disabled:bg-blue-300"
        >
            Generate
        </button>

        <div id="error-message" class="mt-6 p-4 bg-red-100 border border-red-300 rounded-lg text-red-700 hidden">
            <p class="font-semibold">Error:</p>
            <p id="error-text"></p>
        </div>

        <div id="rephrased-output" class="mt-8 p-6 bg-blue-50 border border-blue-300 rounded-lg shadow-inner hidden">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xl font-semibold text-blue-700">After generation</h2>
                <button
                    id="copyButton"
                    class="py-1.5 px-4 bg-blue-600 text-white text-sm font-medium rounded-lg shadow-sm hover:bg-blue-700 transition duration-200"
                >
                    Copy
                </button>
            </div>
            <p id="rephrased-text" class="text-blue-900 leading-relaxed whitespace-pre-line"></p>
            <p id="modelUsed" dir="ltr" class="mt-2 text-xs text-blue-400 text-left"></p>

            <div class="mt-4 pt-3 border-t border-blue-200">
                <label class="inline-flex items-center gap-2 cursor-pointer select-none text-sm text-blue-800">
                    <input id="teachToggle" type="checkbox" class="h-4 w-4 accent-blue-600">
                    Teach mode
                </label>

                <div id="teachPanel" class="mt-3 hidden">
                    <textarea
                        id="expectedText"
                        class="w-full h-24 p-3 text-sm border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 resize-y text-right bg-white"
                        placeholder="Edit the message the way it should be, then save."
                    ></textarea>
                    <div class="mt-2 flex flex-wrap items-center justify-between gap-2 text-sm">
                        <button
                            id="saveExampleButton"
                            class="py-1.5 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition duration-200"
                        >
                            Save
                        </button>
                        <span id="teachStatus" class="text-blue-700"></span>
                        <span class="text-blue-500">
                            <span id="exampleCount">0</span> saved ·
                            <button id="exportButton" class="underline hover:text-blue-700">Export</button> ·
                            <label class="underline hover:text-blue-700 cursor-pointer">
                                Import
                                <input id="importInput" type="file" accept="application/json,.json" class="hidden">
                            </label>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const WORKER_URL = 'https://plain-math-2511.janahussam3.workers.dev';
        const STORAGE_KEY = 'feedbackGenerator.examples.v1';
        const TEACH_KEY = 'feedbackGenerator.teachMode';
        const MAX_PROMPT_EXAMPLES = 5;

        // Tried in order; the next one is used when a model is out of quota, overloaded, or returns nothing.
        const MODELS = [
            'gemini-4-argon',
            'gemini-3.1-pro-preview',
            'gemini-3.8-flash',
            'gemini-3.6-flash',
            'gemini-3-flash-preview'
        ];

        const BUILT_IN_EXAMPLES = [
            {
                input: 'انت مش كاتب نوتش هيرو اور زيرو انتي بتحلي مع الدكتور برافو بس مش كاتب نوتس على الاسءله هو سؤالين تلاته بس تلمقالي صح',
                expected: 'برافو عليكي إنك متابعة الحل مع الدكتور وبتحلي معاه ❤️ لكن محتاجة تهتمي بكتابة Notes Hero or Zero قبل ما تبدأي الـ Class Work، لأنها مهمة جدًا للفهم والـ Revision. كمان النوتس على الأسئلة قليلة جدًا، كاتبة Notes على سؤالين أو تلاتة بس، وباقي الأسئلة من غير نوتس، فلازم تكتبي ملاحظات على كل سؤال من غير استثناء. وبالنسبة للمقالي، إجاباتك صح، برافو عليكي يا شاطرة ❤️'
            }
        ];

        const CLASSWORK_GUIDE = `الـ Class Work مش جزء ممكن نستغنى عنه أو نكتفي فيه بالـ Model Answer، ده من أهم أجزاء الحصة.
الدكتور في الـ Class Work بيقول Notes مهمة جدًا، وبيشارك Links وأفكار بتسهّل حفظ الحاجات اللي محتاجة حفظ، والأسئلة نفسها أفكارها تقيلة ومستواها عالي، وده اللي محتاجين نشوف الدكتور وهو بيفكر فيه ويحله.
حتى لو الطالب حل السؤال صح، لازم يشوف الحل عشان يعرف: هل فكر بنفس طريقة الدكتور؟ هل استخدم الـ Approach الصح؟ هل في طريقة أسرع أو أذكى؟ هل في Note الدكتور ركز عليها وفاتته؟
الـ Class Work بنبني فيه طريقة تفكيرنا في الأسئلة، خصوصًا الأسئلة الـ High Level.
الفرق بين إنك تعرف تحل السؤال وإنك تكون فاهمه فعلًا بيكون في الـ Approach وطريقة التفكير.
مينفعش نعتبر إن الحصة خلصت من غير الـ Class Work، لازم نشوفه للآخر ونستفيد من كل Note وكل طريقة حل.
كتابة Notes Hero or Zero قبل الـ Class Work مهمة للفهم وللـ Revision.
لو في سؤال اتحل غلط: يرجع لفيديو حل الدكتور يفهم سبب الغلطة، وبعدين يحل نفس السؤال تاني بنفسه من غير ما يبص على الحل.`;

        const BANNED_WORDS = [
            'وحش', 'بشع', 'فظيع', 'كارثة', 'مصيبة', 'زفت', 'زبالة', 'خرابيط', 'متخربط', 'مخربط',
            'متلخبط', 'مبهدل', 'بهدلة', 'فوضى', 'عشوائي', 'مهمل', 'متسيب', 'فاشل', 'رديء',
            'تافه', 'سخيف', 'غبي', 'كسلان', 'كسولة', 'بايظ', 'خربان'
        ];

        const KEY_TERMS = [
            'نوت', 'notes', 'هيرو', 'hero', 'زيرو', 'zero', 'كلاس', 'class', 'مقالي', 'اختياري',
            'واجب', 'model', 'موديل', 'فيديو', 'دكتور', 'غلط', 'صح', 'ريفيجن', 'revision', 'مبعوت', 'كامل'
        ];

        const el = (id) => document.getElementById(id);
        const inputTextarea = el('inputText');
        const rephraseButton = el('rephraseButton');
        const rephrasedOutput = el('rephrased-output');
        const rephrasedText = el('rephrased-text');
        const modelUsed = el('modelUsed');
        const errorMessage = el('error-message');
        const errorText = el('error-text');
        const copyButton = el('copyButton');
        const teachToggle = el('teachToggle');
        const teachPanel = el('teachPanel');
        const expectedText = el('expectedText');
        const saveExampleButton = el('saveExampleButton');
        const teachStatus = el('teachStatus');
        const exampleCount = el('exampleCount');
        const exportButton = el('exportButton');
        const importInput = el('importInput');

        // ---------- Storage ----------

        function loadExamples() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed.filter(isValidExample) : [];
            } catch (e) {
                return [];
            }
        }

        function saveExamples(examples) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(examples));
                return true;
            } catch (e) {
                return false;
            }
        }

        function isValidExample(item) {
            return item && typeof item.input === 'string' && typeof item.expected === 'string'
                && item.input.trim() && item.expected.trim();
        }

        // ---------- Text similarity ----------

        function normalizeArabic(text) {
            return text
                .toLowerCase()
                .replace(/[ً-ْـ]/g, '')
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ء/g, '')
                .replace(/[^\p{L}\p{N}\s]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function tokenize(text) {
            return new Set(normalizeArabic(text).split(' ').filter((t) => t.length > 1));
        }

        function similarity(a, b) {
            const ta = tokenize(a);
            const tb = tokenize(b);
            if (!ta.size || !tb.size) return 0;

            let shared = 0;
            ta.forEach((t) => { if (tb.has(t)) shared += 1; });
            const jaccard = shared / (ta.size + tb.size - shared);

            const na = normalizeArabic(a);
            const nb = normalizeArabic(b);
            const termHits = KEY_TERMS.filter((k) => na.includes(k) && nb.includes(k)).length;

            return jaccard + termHits * 0.05;
        }

        function pickExamples(feedback) {
            const saved = loadExamples();
            const pool = [...saved, ...BUILT_IN_EXAMPLES];

            const ranked = pool
                .map((ex, index) => ({ ex, score: similarity(feedback, ex.input), index }))
                .sort((x, y) => y.score - x.score || x.index - y.index);

            const picked = ranked.slice(0, MAX_PROMPT_EXAMPLES).map((r) => r.ex);

            // Keep the newest saved example in context so recent corrections take effect quickly.
            if (saved.length && !picked.includes(saved[0])) {
                picked[picked.length - 1] = saved[0];
            }
            return picked;
        }

        // ---------- Prompt ----------

        function buildPrompt(feedback, examples, correction) {
            const examplesBlock = examples
                .map((ex, i) => `مثال ${i + 1}:\nالملاحظة: ${ex.input.trim()}\nالرسالة المعتمدة: ${ex.expected.trim()}`)
                .join('\n\n');

            return `أنت عضو في فريق متابعة مادة الكيمياء لطلاب الثانوية العامة. بتاخد ملاحظة سريعة مكتوبة على الـ Class Work بتاع طالب أو طالبة (غالباً مختصرة وفيها أخطاء إملائية) وبتحولها لرسالة فيدباك موجهة للطالب مباشرة بالعامية المصرية.

طريقة الشغل (اعملها جوه حقل points قبل ما تكتب الرسالة):
1. افهم الملاحظة وصحح أخطاءها الإملائية في دماغك. مثلاً: "نوتش هيرو اور زيرو" = Notes Hero or Zero، "تلمقالي" = "والمقالي"، "الاسءله" = "الأسئلة".
2. قسّم الملاحظة لنقط منفصلة، وحدد نوع كل نقطة: positive (حاجة اتعملت صح) أو needs_work (حاجة محتاجة تتحسن). الجملة الواحدة ممكن يطلع منها نقطتين، زي "بتحلي مع الدكتور برافو بس مش كاتب نوتس" = نقطة positive ونقطة needs_work.
3. حدد النوع من الملاحظة: لو فيها أي صيغة مؤنثة (انتي، بتحلي، كاتبة، عليكي...) يبقى female حتى لو في كلام بصيغة المذكر، غير كده male.

قواعد الرسالة:
1. كل نقطة في الملاحظة لازم تظهر في الرسالة بنفس معناها بالظبط، من غير ما تحذف نقطة أو تدمج نقطتين لحد ما واحدة تضيع، ومن غير ما تضيف مشكلة أو مدح مش موجودين. لو في رقم أو كمية (زي "سؤالين تلاتة") وضّحه.
2. المدح للنقط الـ positive بس، ويكون مدح محدد للحاجة نفسها. ممنوع تقول "كملي كده" أو "استمر" أو تمدح بعد نقطة needs_work مباشرة كأنها حاجة كويسة.
3. كل نقطة needs_work تتقال بوضوح وبشكل بناء: إيه المطلوب يتعمل بالظبط، ومعاه سبب قصير مقنع (جملة واحدة) ليه ده مهم. خد السبب من المرجع تحت لو مناسب، بكلامك وباختصار، ومتنقلش المرجع.
4. حافظ على المصطلحات واكتبها بالشكل المعتمد: Class Work، Notes، Notes Hero or Zero، Model Answer، Revision، Approach، المقالي، الاختياري، الواجب. ممنوع تبدلها بكلمة عامة زي "الشغل" أو "المذاكرة"، وممنوع تذكر جزء مش مذكور في الملاحظة. "Class Work" دايماً مفرد.
5. ممنوع أي حكم سلبي على الطالب أو شغله (وحش، مهمل، كسلان، عشوائي، مبهدل، مش مرتب...)، حتى لو مكتوب في الملاحظة. حوّله لوصف للي محتاج يتعمل.
6. ابدأ على طول من غير ترحيب. لو في نقطة positive ابدأ بمدحها تحديداً. لو مفيش ولا نقطة positive، متمدحش حاجة مش موجودة، وابدأ بتقدير اهتمامه إنه بعت الـ Class Work.
7. الترتيب الطبيعي: الإيجابي الأول، بعدين اللي محتاج تحسين، وبعدين ختام. لو في نقطة positive متبقية اختم بيها، غير كده اختم بجملة ثقة بضمير "إحنا" زي "إحنا واثقين إن الـ Class Work اللي جاي هيكون أحسن". نوّع صياغة البداية والختام كل مرة.
8. الكلام موجه للطالب بضمير المخاطب وبالنوع الصح، حتى لو الملاحظة مكتوبة بصيغة الغائب.
9. فقرة واحدة (أو اتنين بالكتير) متصلة، من غير شرطة (-) أو ترقيم أو عناوين أو كل جملة في سطر.
10. نبرة دافية وبسيطة: مسموح "برافو عليك/عليكي" و"يا شاطر/يا شاطرة" و ❤️ مرة أو مرتين بالكتير. الطول قريب من طول الأمثلة المعتمدة.

الأمثلة المعتمدة (دي كاتبها فريق المتابعة نفسه، قلّد أسلوبها وطولها وترتيبها ومصطلحاتها، لكن متنسخش جملها لو الملاحظة مختلفة):
${examplesBlock}

المرجع (أفكار عن أهمية الـ Class Work، استخدم منها فكرة قصيرة بس لما تكون مرتبطة بنقطة needs_work):
${CLASSWORK_GUIDE}
${correction ? `\nتنبيه: محاولة سابقة طلعت فيها المشكلة دي: ${correction}. اكتب الرسالة تاني وتجنبها.\n` : ''}
رجّع JSON بس بالشكل ده من غير أي كلام تاني:
{"gender": "female أو male", "points": [{"text": "النقطة", "type": "positive أو needs_work"}], "message": "الرسالة النهائية"}

الملاحظة: ${feedback}`;
        }

        // ---------- Model call ----------

        function extractMessage(rawText) {
            const cleaned = rawText.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
            const candidates = [cleaned, (cleaned.match(/\{[\s\S]*\}/) || [])[0]].filter(Boolean);

            for (const candidate of candidates) {
                try {
                    const data = JSON.parse(candidate);
                    if (data && typeof data.message === 'string' && data.message.trim()) {
                        return data.message.trim();
                    }
                } catch (e) {
                    // Fall through to the next candidate.
                }
            }
            return cleaned.startsWith('{') ? '' : cleaned;
        }

        function findIssue(message) {
            if (/^\s*[-•*]/m.test(message)) return 'في سطر بادئ بشرطة أو نقطة';
            if (/كلاسوركات|class works/i.test(message)) return 'كلمة Class Work اتجمعت';
            const normalized = normalizeArabic(message);
            const hit = BANNED_WORDS.find((w) => normalized.includes(normalizeArabic(w)));
            if (hit) return `استخدمت كلمة فيها حكم سلبي ("${hit}")`;
            return '';
        }

        async function callModel(model, prompt) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature: 0.8,
                        topP: 0.95,
                        responseMimeType: 'application/json'
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`${model} failed with status ${response.status}`);
            }

            const result = await response.json();
            const text = result?.candidates?.[0]?.content?.parts
                ?.filter((p) => !p.thought)
                .map((p) => p.text || '')
                .join('') || '';

            const message = extractMessage(text);
            if (!message) {
                throw new Error(`${model} returned an empty response`);
            }
            return message;
        }

        // Walks the model list from `startIndex` until one answers.
        async function requestMessage(prompt, startIndex = 0) {
            let lastError;
            for (let i = startIndex; i < MODELS.length; i += 1) {
                try {
                    const message = await callModel(MODELS[i], prompt);
                    return { message, modelIndex: i };
                } catch (e) {
                    lastError = e;
                    console.warn(e.message);
                }
            }
            throw lastError || new Error('No model available');
        }

        async function generate(feedback) {
            const examples = pickExamples(feedback);
            let result = await requestMessage(buildPrompt(feedback, examples));

            const issue = findIssue(result.message);
            if (issue) {
                try {
                    const retry = await requestMessage(buildPrompt(feedback, examples, issue), result.modelIndex);
                    if (!findIssue(retry.message)) result = retry;
                } catch (e) {
                    // Keep the first answer if the retry cannot be completed.
                }
            }
            return { message: result.message, model: MODELS[result.modelIndex] };
        }

        // ---------- UI helpers ----------

        function showError(text) {
            errorMessage.classList.remove('hidden');
            errorText.textContent = text;
        }

        function flashStatus(text) {
            teachStatus.textContent = text;
            setTimeout(() => {
                if (teachStatus.textContent === text) teachStatus.textContent = '';
            }, 2500);
        }

        function refreshExampleCount() {
            exampleCount.textContent = loadExamples().length;
        }

        function setTeachMode(enabled) {
            teachToggle.checked = enabled;
            teachPanel.classList.toggle('hidden', !enabled);
            try { localStorage.setItem(TEACH_KEY, enabled ? '1' : '0'); } catch (e) { /* ignore */ }

            if (enabled) {
                if (!expectedText.value.trim()) expectedText.value = rephrasedText.textContent.trim();
                refreshExampleCount();
            }
        }

        // ---------- Events ----------

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(rephrasedText.textContent);
                copyButton.textContent = 'Copied';
            } catch (e) {
                copyButton.textContent = 'Copy failed';
            }
            setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
        });

        rephraseButton.addEventListener('click', async () => {
            const feedback = inputTextarea.value.trim();

            if (!feedback) {
                showError('Please write the original feedback.');
                rephrasedOutput.classList.add('hidden');
                return;
            }

            rephraseButton.disabled = true;
            rephraseButton.textContent = 'Generating...';
            errorMessage.classList.add('hidden');
            rephrasedOutput.classList.add('hidden');

            try {
                const { message, model } = await generate(feedback);
                rephrasedText.textContent = message;
                modelUsed.textContent = model;
                expectedText.value = message;
                rephrasedOutput.classList.remove('hidden');
            } catch (e) {
                showError(navigator.onLine
                    ? 'Please try again. Eng.Jana is upgrading it now'
                    : 'Unexpected error. Please check your internet connection and try again.');
            } finally {
                rephraseButton.disabled = false;
                rephraseButton.textContent = 'Generate another message';
            }
        });

        teachToggle.addEventListener('change', () => setTeachMode(teachToggle.checked));

        saveExampleButton.addEventListener('click', () => {
            const input = inputTextarea.value.trim();
            const expected = expectedText.value.trim();

            if (!input || !expected) {
                flashStatus('Feedback and message are both required.');
                return;
            }

            const key = normalizeArabic(input);
            const examples = loadExamples().filter((ex) => normalizeArabic(ex.input) !== key);
            examples.unshift({ input, expected, createdAt: new Date().toISOString() });

            if (saveExamples(examples)) {
                refreshExampleCount();
                flashStatus('Saved');
            } else {
                flashStatus('Browser storage is unavailable.');
            }
        });

        exportButton.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(loadExamples(), null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `feedback-examples-${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        });

        importInput.addEventListener('change', async () => {
            const file = importInput.files?.[0];
            importInput.value = '';
            if (!file) return;

            try {
                const incoming = JSON.parse(await file.text());
                if (!Array.isArray(incoming)) throw new Error('Invalid format');

                const merged = loadExamples();
                const known = new Set(merged.map((ex) => normalizeArabic(ex.input)));
                let added = 0;

                incoming.filter(isValidExample).forEach((ex) => {
                    const key = normalizeArabic(ex.input);
                    if (known.has(key)) return;
                    known.add(key);
                    merged.push({
                        input: ex.input.trim(),
                        expected: ex.expected.trim(),
                        createdAt: ex.createdAt || new Date().toISOString()
                    });
                    added += 1;
                });

                saveExamples(merged);
                refreshExampleCount();
                flashStatus(`Imported ${added}`);
            } catch (e) {
                flashStatus('Import failed.');
            }
        });

        let initialTeachMode = false;
        try { initialTeachMode = localStorage.getItem(TEACH_KEY) === '1'; } catch (e) { /* ignore */ }
        setTeachMode(initialTeachMode);
    });
    </script>
</body>
</html>
