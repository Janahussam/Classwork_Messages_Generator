<!DOCTYPE html>

</head>
<body>

    <div class="card">

    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // Tried in order; the next one is used when a model is out of quota, overloaded, or returns nothing.
        // The last entry is the high-quota workhorse that absorbs the daily volume.
        const MODELS = [
            'gemini-4-argon',
            'gemini-3.1-pro-preview',
            'gemini-3.8-flash'
        ];

        const CLASSWORK_GUIDE = `أول جزء في الـ Class Work اسمه Notes Hero or Zero، ودي Notes الطالب بيكتبها علشان يكتسب ترتيب خطوات الحل.
بعدها في كل سؤال: الطالب بيقرا السؤال ويفكر فيه ويحاول يحله، وبعدين يتفرج على حل الدكتور في الفيديو ويكتب النوتس.
الـ Class Work ملوش Model Answer، لأن حل الدكتور في الفيديو هو الأساس، والطالب ميقدرش يقيم نفسه فيه لوحده.
الـ Model Answer موجود للواجب بس على الميني جروب: الطالب بيصحح الواجب منه، ولو في حاجة مش فاهمها بيرجع لها في الفيديو.`;

        const ADVICE_GUIDE = `الدليل ده مش قوالب جاهزة، ده شرح لكل مشكلة: ليه هي مشكلة، وإيه اللي بيحلها. استخدمه علشان تفهم، وبعدين فكر في الطالب ده بالذات واكتب له بكلامك انت كلام كامل ومفهوم بيشرحله المطلوب بالظبط وليه. ممنوع تنقل جمل البنود زي ما هي. استخدم البند بس لو الملاحظة فيها الحالة دي، وخد منه الفكرة اللي تناسب الطالب ده، مش كل اللي فيه.

1. مش كاتب Notes Hero or Zero (أو كاتبها ناقصة):
النصيحة: اكتب Notes Hero or Zero كاملة في أول الـ Class Work قبل ما تبدأ الأسئلة.
السبب: هي اللي بتكسبك ترتيب خطوات الحل، فلما تبدأ الأسئلة تبقى عارف تمشي إزاي، وبترجعلها وقت الـ Revision.

2. مفيش نوتس على الأسئلة، أو النوتس على بعض الأسئلة بس، أو قليلة (في الـ MCQ أو المقالي):
النصيحة: بعد ما تجرب السؤال وتشوف حل الدكتور، اكتب النوتة والخطوات اللي الدكتور قالها على السؤال ده، على كل سؤال من غير استثناء، مش الإجابة النهائية بس.
السبب: لما ترجع تراجع السؤال بعد كده هتلاقي فكرته وطريقة حله قدامك بدل ما ترجع للفيديو تاني، والنوتس بتبقى زي hints للأسئلة اللي شبهه.

3. النوتس موجودة بس مش منظمة أو مكتوبة بشكل متفرق:
النصيحة: خلي كل نوتة جنب السؤال بتاعها، ورتبها خطوة ورا خطوة.
السبب: النوتس المرتبة هي اللي بتعرف ترجعلها بسرعة وقت المراجعة.

4. مش كاتب خطوات الحل، حاطط الإجابة على طول:
النصيحة: اكتب كل خطوة في الحل حتى لو شايفها سهلة.
السبب: الخطوات بتورينا انت بتفكر إزاي ولو فيه غلط بنعرف هو فين، ولما ترجع للسؤال وقت المراجعة هتعرف انت حليته إزاي.

5. أسئلة محددة اتحلت غلط (بأرقامها):
النصيحة: اذكر أرقام الأسئلة زي ما هي في الملاحظة، ولو الملاحظة فيها الإجابة الصح اذكرها. ارجع لحل الدكتور للأسئلة دي وافهم سبب الغلطة، وصححها بلون تاني واكتب سببها جنبها.
السبب: الغلطة اللي بتفهم سببها وتصححها بنفسك بتفتكرها ومتكررهاش.

6. أسئلة مش محلولة، أو متعلم عليها من غير حل:
النصيحة: ارجع حلها، ولو في سؤال مش فاهمه ابعته على الميني جروب والتيم العلمي هيرد عليك.

7. مختار أكتر من إجابة في سؤال، أو الإجابة مش واضحة (قلم خفيف، شطب):
النصيحة: حدد إجابة واحدة بس وبشكل واضح.
السبب: علشان نعرف انت اخترت إيه بالظبط ونقدر نصححلك صح.

8. المقالي مختصر أو الإجابة ناقصة أو مش مستوفية المطلوب (زي سؤال طالب Explain):
النصيحة: اقرا السؤال للآخر واكتب كل المطلوب فيه بالتفصيل.
السبب: المقالي عليه 50% من الامتحان، والإجابة الناقصة بتضيع درجات من غير ما تاخد بالك.

9. المقالي أو أجزاء من الـ Class Work مش مبعوتة أو مش محلولة:
النصيحة: كمل الأسئلة الناقصة وابعت الـ Class Work كامل المرة الجاية.
السبب: علشان نقدر نراجع مستواك في كل الأجزاء، والمقالي بالذات عليه 50% من الامتحان.

10. الصفحات مش مترتبة، أو متصورة بالمقلوب أو مش واضحة:
النصيحة: رتب الصفحات بالترتيب وصور كل صفحة بوضوح وفي الاتجاه الصح، والاسم التلاتي والكود على أول صفحة بس.
السبب: الشكل المنظم بيسهل التصحيح وبيساعدك انت وانت بتراجع.

11. الملف مبعوت صور أو ZIP أو Long Image مش PDF، أو حجمه كبير جداً (البند ده بس اللي يتذكر فيه أبلكيشن):
النصيحة: اجمع الصور في ملف PDF واحد، ممكن من CamScanner أو iLovePDF.

12. اللي اتبعت مش هو المطلوب. في الحالات دي قول بوضوح إيه اللي اتبعت، وإيه المطلوب يتبعت بالكامل، وليه:
أ. باعت نوتس بس من غير حل الأسئلة: متشكرهوش ومتمدحش إنه بعت. ابدأ على طول بإن اللي اتبعت نوتس بس وإن الـ Class Work نفسه مش موجود، ووضح إن المطلوب الـ Class Work كامل ومحلول بنوتس: Notes Hero or Zero قبل الحل، وبعدها حل الأسئلة والنوتس المهمة مكتوبة عليها. امدح النوتس بس لو الملاحظة نفسها قالت إنها كويسة.
ب. باعت الواجب بدل الـ Class Work: اشكره إنه حل الواجب، ووضح إن المطلوب يتبعت هو الـ Class Work كامل بالحل والنوتس، والواجب بيصححه بنفسه من الـ Model Answer اللي على الميني جروب.
ج. باعت ليسون أو شابتر غير المطلوب: اذكر اللي اتبعت واللي كان مطلوب زي ما هما مكتوبين في الملاحظة، واطلب منه يتأكد من رقم الليسون والشابتر قبل ما يبعت، علشان يتصحح الـ Class Work الصح.
د. باعت أكتر من Class Work في نفس المرة: وضح إن المطلوب Class Work واحد بس، اللي اتطلب منه، علشان التصحيح يكون مركز عليه.
هـ. باعت جزء بس (صفحة أو صفحتين أو لحد سؤال معين): اذكر لحد فين اتبعت زي ما هو في الملاحظة، ووضح إن المطلوب الـ Class Work كامل بكل أسئلته، علشان نقدر نراجع كل حاجة.

13. الخط مش واضح أو الكلام داخل في بعضه (أو الملاحظة قالت "الخط وحش"):
النصيحة: هنحتاج نحسن الخط الفترة الجاية، ونسيب مسافات بين الكلمات والسطور.
السبب: علشان نحافظ على التنظيم، وعلشان تقدر تقرا النوتس بتاعتك لو احتجت ترجع تراجع على السيشن، وإجاباتك تتقرا بسهولة في الامتحان.

14. الرسومات مش مظبوطة:
النصيحة: استخدم مسطرة وارسم بنظام.

15. حل الأسئلة كلها وبعدين شاف الحل:
النصيحة: امشي سؤال بسؤال: تقرا وتفكر وتكتب حلك، وبعدين تشوف حل الدكتور للسؤال ده وتكتب النوتة.
السبب: الطريقة دي هي اللي بتخلي الـ Class Work يبني طريقة تفكيرك.

16. ناقل الحل من غير ما يجرب:
النصيحة: جرب لوحدك الأول حتى لو طلع غلط، وبعدين اتفرج على الحل وصحح.

17. كاتب الكود غلط أو باعت اسمه بدل الكود:
النصيحة: اكتب الكود الصح (لو الملاحظة فيها الكود اذكره زي ما هو) واتأكد منه قبل ما تبعت.

حاجات تتمدح لو الملاحظة ذكرتها: بيحل الأول وبعدين بيصحح لنفسه (طريقة ممتازة بتعرفه أخطاءه)، كاتب نوتس خارجية كويسة (بس هي مش بديل عن النوتس على الأسئلة)، خطه منظم، بيستخدم Highlighter، بيكتب ورا الدكتور كل النوتس، بيحل بالاستبعاد.`;

        const BANNED_WORDS = [
            'وحش', 'بشع', 'فظيع', 'كارثة', 'مصيبة', 'زفت', 'زبالة', 'خرابيط', 'متخربط', 'مخربط',
            'متلخبط', 'مبهدل', 'بهدلة', 'فوضى', 'عشوائي', 'مهمل', 'متسيب', 'فاشل', 'رديء',
            'تافه', 'سخيف', 'غبي', 'كسلان', 'كسولة', 'بايظ', 'خربان'
        ];

        const STOP_WORDS = new Set([
            'مش', 'انت', 'انتي', 'في', 'على', 'علي', 'من', 'عن', 'بس', 'كل', 'كله', 'كمان', 'هو', 'هي',
            'اللي', 'ده', 'دي', 'مع', 'او', 'لو', 'ما', 'لا', 'كاتب', 'كاتبه', 'محتاج', 'محتاجه', 'الطالب'
        ]);

        const el = (id) => document.getElementById(id);
        const inputTextarea = el('inputText');
        const inputStatus = el('inputStatus');
        const rephraseButton = el('rephraseButton');
        const rephrasedOutput = el('rephrased-output');
        const rephrasedText = el('rephrased-text');
        const errorMessage = el('error-message');
        const errorText = el('error-text');
        const copyButton = el('copyButton');
        const teachToggle = el('teachToggle');
        const teachPanel = el('teachPanel');
        const expectedText = el('expectedText');
        const saveExampleButton = el('saveExampleButton');
        const teachStatus = el('teachStatus');

        let lastFeedback = '';
        let lastGenerated = '';

        // ---------- Storage ----------

        function readList(key) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function writeList(key, list) {
            try {
                localStorage.setItem(key, JSON.stringify(list));
                return true;
            } catch (e) {
                return false;
            }
        }

        function isValidExample(item) {
            return item && typeof item.input === 'string' && typeof item.expected === 'string'
                && item.input.trim() && item.expected.trim();
        }

        function isValidRule(item) {
            return item && typeof item.text === 'string' && item.text.trim()
                && (item.source === 'note' || item.source === 'correction');
        }

        const loadExamples = () => readList(EXAMPLES_KEY).filter(isValidExample);
        const saveExamples = (list) => writeList(EXAMPLES_KEY, list);
        const loadRules = () => readList(RULES_KEY).filter(isValidRule);
        const saveRules = (list) => writeList(RULES_KEY, list);

        // Adds rules that are not already stored; learned rules are capped, team notes never expire.
        function addRules(texts, source) {
            const rules = loadRules();
            const known = new Set(rules.map((r) => normalizeArabic(r.text)));
            let added = 0;

            texts.map((t) => t.trim()).filter(Boolean).forEach((text) => {
                const key = normalizeArabic(text);
                if (!key || known.has(key)) return;
                known.add(key);
                rules.unshift({ text, source, createdAt: new Date().toISOString() });
                added += 1;
            });

            const notes = rules.filter((r) => r.source === 'note');
            const learned = rules.filter((r) => r.source === 'correction').slice(0, MAX_LEARNED_RULES);
            saveRules([...notes, ...learned]);
            return added;
        }

        // ---------- Text helpers ----------

        function normalizeArabic(text) {
            return text
                .toLowerCase()
                .replace(/[ً-ْـ]/g, '')
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ء/g, '')
                .replace(/[^\p{L}\p{N}\s]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function tokenize(text) {
            return new Set(normalizeArabic(text).split(' ').filter((t) => t.length > 1));
        }

        function keywords(text) {
            return [...tokenize(text)].filter((t) => t.length > 2 && !STOP_WORDS.has(t));
        }

        // Anything written between parentheses is an instruction to the model, not part of the feedback.
        function splitInstructions(text) {
            const instructions = [];
            const feedback = text
                .replace(/[(（]([^()（）]*)[)）]/g, (_, inner) => {
                    if (inner.trim()) instructions.push(inner.trim());
                    return ' ';
                })
                .replace(/\s+/g, ' ')
                .trim();
            return { feedback, instructions };
        }

        // Situation tags shared by raw notes and finished messages, so matching is by the student's case, not wording.
        const SITUATION_TAGS = {
            heroMissing: /(مش|مفيش|ناقص|منغير|من غير|فين).{0,30}herozero/,
            heroDone: /(كاتب|كاتبه|مجمع|مكتوبه).{0,8}herozero/,
            notesNone: /((مفيش|من ?غير|بدون|منغير).{0,12}(نوتس|notes|نوت)|مش (بتحل|بتحلي|كاتب|كاتبه).{0,12}(نوتس|notes))( خالص| نهائي| نهائيا|$| )/,
            notesPartial: /(مش على كل|مش في كل|مش ف كل|بعض الاسئله|اسئله و اسئله|قليله|معظم|كام سؤال|سؤالين)/,
            notesMessy: /(عشوائي|منظمه اكتر|مش منظم|نظمي|ننظم)/,
            wrong: /غلط/,

                '(باعت|باعته|باعتالي|بعتلي|مبعوت|بعت)\\S* غير (ال)?(نوتس|صفحه|ورقه)',
                '(باعت|باعته|باعتالي|بعتلي|مبعوت|بعت)\\S* (ال)?(نوتس|صفحه|ورقه|صور|واجب|الواجب)( \\S+)? (بس|وبس)',
                'فين (ال)?(كلاس|class)', 'فين بقيت', 'مش بيفتح', '(فايل|ملف) فاضي',
                'مش (باعت|باعته) (ال)?(كلاس|class)'

        };

        // Problems that must never appear in a message unless the note itself reports them.
        const GROUNDED_TAGS = {
            wrongSubmission: 'إن اللي اتبعت مش الـ Class Work',
            essayMissing: 'إن المقالي مش مبعوت',
            fileFormat: 'مشكلة في شكل الملف',
            wrongLesson: 'ليسون أو شابتر غلط',
            twoAnswers: 'إنه مختار أكتر من إجابة',
            studentCode: 'الكود',
            unsolved: 'أسئلة مش محلولة'
        };

        const tagCache = new Map();

        function situationTags(text) {
            if (tagCache.has(text)) return tagCache.get(text);
            // "Notes Hero or Zero" is its own item; mask it so it doesn't read as "no notes on the questions".
            const normalized = normalizeArabic(text)
                .replace(/(نوتس|نوتي|notes)? ?(هيرو|hero)\S* ?(اور|or)? ?(زيرو|zero)?/g, ' herozero ');
            const tags = new Set(Object.keys(SITUATION_TAGS).filter((tag) => SITUATION_TAGS[tag].test(normalized)));
            if (tags.has('heroMissing')) tags.delete('heroDone');
            tagCache.set(text, tags);
            return tags;
        }

        function jaccard(a, b) {
            if (!a.size || !b.size) return 0;
            let shared = 0;
            a.forEach((t) => { if (b.has(t)) shared += 1; });
            return shared / (a.size + b.size - shared);
        }

        // Weighted toward covering every situation in the new note (a), then toward references without extra noise.
        function situationMatch(a, b) {
            if (!a.size || !b.size) return 0;
            let shared = 0;
            a.forEach((t) => { if (b.has(t)) shared += 1; });
            return 0.7 * (shared / a.size) + 0.3 * (shared / b.size);
        }

        function similarity(a, b) {
            return situationMatch(situationTags(a), situationTags(b)) + 0.3 * jaccard(tokenize(a), tokenize(b));
        }

        function pickExamples(feedback) {
            const pool = loadExamples();

            const tags = situationTags(feedback);

            // An example is only useful when it describes the same kind of case; an unrelated one gets copied.
            const relevant = (ex) => {
                const exTags = situationTags(ex.input);
                if (exTags.has('wrongSubmission') !== tags.has('wrongSubmission')) return false;
                return situationMatch(tags, exTags) >= 0.5;
            };

            return pool
                .map((ex, index) => ({ ex, score: similarity(feedback, ex.input), index }))
                .filter((r) => relevant(r.ex))
                .sort((x, y) => y.score - x.score || x.index - y.index)
                .slice(0, MAX_PROMPT_EXAMPLES)
                .map((r) => r.ex);
        }

        function formatExample(ex, index) {
            const lines = [`مثال ${index + 1}:`, `الملاحظة: ${ex.input.trim()}`];

            const notes = rules.filter((r) => r.source === 'note').map((r) => `• ${r.text}`);

            }
            return blocks.join('\n\n');
        }

            const examplesBlock = examples.map(formatExample).join('\n\n');
            const rulesBlock = formatRules();

            return `أنت عضو في فريق متابعة مادة الكيمياء لطلاب الثانوية العامة. بتاخد ملاحظة سريعة مكتوبة على الـ Class Work بتاع طالب أو طالبة (غالباً مختصرة وفيها أخطاء إملائية) وبتحولها لرسالة فيدباك بالعامية المصرية بتكلم الطالب نفسه مباشرة.
${rulesBlock ? `\n${rulesBlock}\n` : ''}
طريقة الشغل (اعملها جوه حقل points قبل ما تكتب الرسالة):
1. افهم الملاحظة وصحح أخطاءها الإملائية في دماغك. مثلاً: "نوتش هيرو اور زيرو" = Notes Hero or Zero، "تلمقالي" = "والمقالي"، "الاسءله" = "الأسئلة"، "ام سي كيو" = MCQ، "نوتي احصة" = "نوتس الحصة".
   اقرا النفي كويس: "مش باعت نوتس الحصة" معناها إن النوتس دي ناقصة، ومش معناها إنه باعت نوتس بس. "باعت نوتس بس" أو "فين الكلاس ورك" بس هي اللي معناها إن الـ Class Work نفسه مش مبعوت.
   الملاحظة اللي قدامك هي المصدر الوحيد. أي مشكلة مش مكتوبة فيها صراحة ممنوع تظهر في الرسالة، حتى لو موجودة في مثال أو في رسالة مرجعية.
2. قسّم الملاحظة لنقط منفصلة بنفس ترتيبها في الملاحظة بالظبط، وحدد نوع كل نقطة: positive (حاجة اتعملت صح) أو needs_work (حاجة محتاجة تتحسن). الجملة الواحدة ممكن يطلع منها نقطتين، زي "بتحلي مع الدكتور برافو بس مش كاتب نوتس" = نقطة positive ونقطة needs_work.
3. لكل نقطة needs_work حدد رقم البند المناسب ليها من دليل النصايح في guide_item، واكتب النصيحة في advice من البند ده بس.
4. حدد النوع من الملاحظة: لو فيها أي صيغة مؤنثة (انتي، بتحلي، كاتبة، عليكي...) يبقى female حتى لو في كلام بصيغة المذكر، غير كده male.

قواعد الرسالة:
1. التزم بالملاحظة وبس: كل نقطة فيها لازم تظهر بنفس معناها، ومتضيفش أي نقطة أو مشكلة أو مدح أو معلومة مش موجودة فيها. ممنوع تخترع معلومات زي رقم شابتر أو اسم درس أو ميعاد أو اسم أبلكيشن أو موقع. أي رقم في الرسالة لازم يكون مكتوب في الملاحظة نفسها. لو في كمية مذكورة (زي "سؤالين تلاتة") وضّحها.
2. البداية: لو الطالب بعت الـ Class Work فعلاً، ابدأ بجملة شكر قصيرة إنه مهتم وبعته (زي "مبسوطين إنك مهتم وبعت الـ Class Work")، ونوّع صياغتها كل مرة. لو اللي اتبعت مش الـ Class Work أو ناقص بشكل أساسي (نوتس بس، الواجب بس، صفحة أو ورقة واحدة، ليسون غلط، فايل فاضي أو مش بيفتح)، متشكرش ومتشجعش، ابدأ على طول بالمشكلة بوضوح. من غير ترحيب زي "أهلاً".
التشجيع على قد الحاجة الكويسة الموجودة فعلاً في الملاحظة وبس. متشجعش على حاجة غلط أو ناقصة، ولو مفيش ولا نقطة positive متقولش "برافو" ولا "شاطر" ولا "ممتاز".
3. الترتيب: بعد الشكر امشي على النقط بنفس ترتيبها في الملاحظة بالظبط، نقطة ورا نقطة، من غير ما تقدم نقطة أو تأخرها.
4. النقطة الـ positive: مدح محدد للحاجة نفسها، زي "برافو عليك إن أسئلة المقالي محلولة صح".
5. النقطة needs_work: قول المشكلة بوضوح، وبعدها على طول نصيحة عملية مربوطة بيها: تعمل إيه بالظبط وإزاي، ومعاها سبب مقنع (جملة أو اتنين) ليه ده هيفرق معاك. النصيحة تيجي من بند المشكلة دي في دليل النصايح بس. ممنوع تجيب نصيحة من بند تاني، أو نصيحة عامة مالهاش علاقة بالنقطة، أو تحشر كل الأسباب اللي في البند. ممنوع نصيحة فاضية زي "لأنها مهمة" أو "ركز أكتر".
6. الطالب بعت الـ Class Work فعلاً، فمتطلبش منه يبعته، ومتقترحش أي أبلكيشن أو موقع أو أداة (تصوير، PDF، أو غيره).
7. الـ Class Work ملوش Model Answer: الطالب بيقرا السؤال ويفكر فيه، وبعدين يشوف حل الدكتور في الفيديو ويكتب النوتس. ممنوع تذكر الـ Model Answer في أي كلام عن الـ Class Work. الـ Model Answer للواجب بس، ويتذكر بس لو الملاحظة بتتكلم عن الواجب.
8. حافظ على المصطلحات واكتبها بالشكل المعتمد: Class Work، Notes، Notes Hero or Zero، MCQ، المقالي، الاختياري، الواجب. ممنوع تبدلها بكلمة عامة زي "الشغل" أو "المذاكرة". "Class Work" دايماً مفرد.
9. الكلام السلبي في الملاحظة (وحش، مهمل، كسلان، عشوائي، مبهدل، مكروت، مشغبط...) ممنوع يتشال أو يتجاهل، النقطة نفسها لازم تتقال. اللي بيتغير هو الصياغة بس: بدل الحكم السلبي اكتب الحاجة اللي محتاجين نحسنها، وليه ده هيفرق معاه. أمثلة:
   "خطك وحش" ← "هنحتاج نحسن الخط الفترة الجاية علشان نحافظ على التنظيم، وعلشان تقدر تقرا النوتس بتاعتك لو احتجت ترجع تراجع على السيشن".
   "النوتس عشوائية" ← "محتاجين نرتب النوتس ونخلي كل نوتة جنب السؤال بتاعها، علشان تعرف ترجعلها بسهولة وقت المراجعة".
   "الحل مكروت / مشغبط" ← "محتاجين ناخد وقتنا في الحل ونكتب بهدوء، لأن الـ Class Work مش مطلوب يخلص بسرعة، والمهم إنك تقدر ترجعله وتفهمه".
   "مهمل في الـ Class Work" ← "محتاجين نهتم بالـ Class Work أكتر الفترة الجاية" ومعاها النقطة المحددة اللي في الملاحظة.
10. الرسالة كلها كلام موجه للطالب نفسه بضمير المخاطب (انت/انتي) وبالنوع الصح. ممنوع تتكلم عنه بصيغة الغائب، يعني ممنوع "الطالب" أو "هو بيحل" أو "هي كاتبة". دليل النصايح مكتوب بالمخاطب المذكر، فحوّله للنوع الصح.
11. الختام: اقفل بالحاجة اللي مستنيينها منه في الـ Class Work الجاي، مربوطة بالنقط اللي اتقالت، زي "مستنيين النوتس مترتبة ومنظمة المرة الجاية يا شاطر ❤️". لو كل النقط positive اقفل بتشجيع بسيط.
12. فقرة واحدة متصلة، من غير شرطة (-) أو ترقيم أو عناوين أو كل جملة في سطر.
13. نبرة دافية وبسيطة من غير مبالغة: "برافو عليك/عليكي" و"يا شاطر/يا شاطرة" بس على نقطة positive حقيقية، و ❤️ مرة بالكتير (اتنين لو الرسالة فيها مدح حقيقي). متطولش بكلام عام، كل جملة لازم تكون عن نقطة في الملاحظة.
14. التفاصيل: لو الملاحظة فيها أرقام أسئلة أو إجابات صح (زي "رقم 4 غلط هي C") أو اسم الطالب أو كود، اذكرها زي ما هي بالظبط ومتغيرهاش. متضيفش أرقام أسئلة مش موجودة.
15. الطول: حوالي 60 لـ 120 كلمة، ويزيد بس لو الملاحظة فيها نقط كتير. كل رسالة تتكتب من الأول على مقاس الطالب ده، مش قالب ثابت.

            for (const candidate of candidates) {

                } catch (e) {

                }

            return null;

            if (copied) {
                return copied.source === 'example'
                    ? `نقلت جملة من رسالة لطالب تاني ("${copied.gram}")، اكتب الرسالة من الملاحظة اللي قدامك بكلامك`
                    : `استخدمت جملة جاهزة من دليل النصايح زي ما هي ("${copied.gram}")، فكّر في الطالب ده واكتب النصيحة بكلامك`;
            }

            const opening = normalized.split(' ').slice(0, 14).join(' ');
            const thanksInOpening = /(شكر|متشكرين|مبسوطين|مبسوطه|مبسوط|اهتمامك|حلو انك|جميل انك)/.test(opening);
            const wrongSubmission = situationTags(feedback).has('wrongSubmission');
            if (wrongSubmission && thanksInOpening) {
                return 'اللي اتبعت مش الـ Class Work المطلوب، فمتشكرش في الأول، ابدأ على طول بالمشكلة';
            }
            if (!wrongSubmission && !thanksInOpening) {
                return 'الرسالة مبدأتش بشكر الطالب إنه مهتم وبعت الـ Class Work';
            }

            const praiseCount = (normalized.match(/برافو/g) || []).length;
            const heartCount = (message.match(/❤️|❤/g) || []).length;
            if (praiseCount > 2 || heartCount > 2) {
                return 'الرسالة فيها تكرار للمدح أو القلوب، خليها مرة أو مرتين بالكتير';
            }

            const hasPositive = points.some((p) => p && p.type === 'positive');
            if (points.length && !hasPositive && /(برافو|شاطر|شاطره|ممتاز|تحفه)/.test(normalized)) {
                return 'مدحت الطالب ومفيش في الملاحظة حاجة كويسة تتمدح، التشجيع على قد الحاجة الكويسة بس';
            }

            const fileIssue = /(pdf|zip|صور|صوره|ميجا|حجم|فايل|ملف|long image|اللونج)/i.test(normalizedFeedback);
            const tool = /(camscanner|cam scanner|ilovepdf|i love pdf|كام ?سكانر|اي ?لاف ?بي ?دي ?اف)/i.exec(normalized);
            if (tool && !fileIssue) {
                return `اقترحت أداة أو أبلكيشن ("${tool[0]}") والطالب بعت الـ Class Work خلاص`;
            }

            const toLatinDigits = (text) => text.replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660));
            const feedbackNumbers = new Set([...(toLatinDigits(feedback).match(/\d+/g) || []), '50']);
            const invented = (toLatinDigits(message).match(/\d+/g) || []).find((n) => !feedbackNumbers.has(n));
            if (invented) {
                return `ذكرت رقم ("${invented}") مش موجود في الملاحظة، ممنوع تخترع معلومات`;
            }
            if (/(شابتر|chapter|الفصل|الباب)/i.test(normalized) && !/(شابتر|chapter|الفصل|الباب)/i.test(normalizedFeedback)) {
                return 'ذكرت شابتر أو فصل مش موجود في الملاحظة، ممنوع تخترع معلومات';
            }

            if (/(الدرجه|الدرجات|درجه).{0,20}(الخطوات|الناتج)/.test(normalized) && !/(الدرجه|درجه)/.test(normalizedFeedback)) {
                return 'قلت معلومة عن توزيع الدرجات مش موجودة في الملاحظة، ممنوع تخترع معلومات';
            }

            const aboutHomework = /(واجب|هوم ?ورك|homework)/i.test(normalizedFeedback);
            if (!aboutHomework && /(model answer|موديل ا?نسر)/i.test(normalized)) {
                return 'ذكرت الـ Model Answer، والـ Class Work ملوش Model Answer';
            }

            const pending = points.filter((p) => p && p.type === 'needs_work' && typeof p.text === 'string');
            for (const point of pending) {
                const words = keywords(point.text);
                if (words.length && !words.some((w) => normalized.includes(w))) {
                    return `الرسالة مذكرتش النقطة اللي محتاجة تتحسن: "${point.text}"`;
                }
            }
            if (pending.length && !/(لان|عشان|علشان|هيساعد|هيفرق|هتفرق|مهم|هتفهم|هيخليك|هيخليكي)/.test(normalized)) {
                return 'الرسالة مفيهاش نصيحة أو سبب للنقطة اللي محتاجة تتحسن';
            }
            const wordCount = (text) => normalizeArabic(text || '').split(' ').filter(Boolean).length;
            if (pending.length && !pending.some((p) => wordCount(p.advice) >= 15)) {
                return 'النصيحة قصيرة وعامة، لازم أهم نقطة يتقال فيها تعمل إيه بالظبط وإزاي وليه ده هيفرق معاك';
            }
            return '';
        }

        // ---------- Model calls ----------

        async function callModel(model, prompt, temperature) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature,
                        topP: 0.95,
                        maxOutputTokens: 4096,
                        responseMimeType: 'application/json'
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`${model} failed with status ${response.status}`);
            }

            const result = await response.json();
            const candidate = result?.candidates?.[0];
            if (candidate?.finishReason === 'MAX_TOKENS') {
                throw new Error(`${model} response was truncated`);
            }

            return candidate?.content?.parts
                ?.filter((p) => !p.thought)
                .map((p) => p.text || '')
                .join('') || '';
        }

        // Walks the model list from `startIndex` until one returns a parseable answer.
        async function requestWithFallback(prompt, parse, { startIndex = 0, temperature = 0.6 } = {}) {
            let lastError;
            for (let i = startIndex; i < MODELS.length; i += 1) {
                try {
                    const parsed = parse(await callModel(MODELS[i], prompt, temperature));
                    if (parsed) return { ...parsed, modelIndex: i };
                    lastError = new Error(`${MODELS[i]} returned an empty or incomplete response`);
                } catch (e) {
                    lastError = e;
                }
                console.warn(lastError.message);
            }
            throw lastError || new Error('No model available');
        }

        async function generate(feedback) {
            const examples = pickExamples(feedback);
            let result = await requestWithFallback(buildPrompt(feedback, examples), parseMessage);

            let issue = findIssue(result.message, result.points, feedback);
            for (let attempt = 0; issue && attempt < 3; attempt += 1) {
                try {
                    const retry = await requestWithFallback(
                        buildPrompt(feedback, examples, issue),
                        parseMessage,
                        { startIndex: result.modelIndex }
                    );
                    const retryIssue = findIssue(retry.message, retry.points, feedback);
                    if (!retryIssue) {
                        result = retry;
                        break;
                    }
                    issue = retryIssue;
                } catch (e) {
                    break;
                }
            }
            if (issue && isCritical(issue)) {
                console.warn('Rejected message:', issue);
                throw new Error('UNRELIABLE_MESSAGE');
            }
            return result.message;
        }

        async function learnFromCorrection(feedback, generated, corrected) {
            const { lessons } = await requestWithFallback(
                buildLessonPrompt(feedback, generated, corrected),
                (text) => {
                    const parsed = parseLessons(text);
                    return parsed ? { lessons: parsed } : null;
                },
                { temperature: 0.2 }
            );
            return addRules(lessons, 'correction');
        }

        // ---------- UI helpers ----------

        function showError(text) {
            errorMessage.classList.remove('hidden');
            errorText.textContent = text;
        }

        function flash(target, text, duration = 3000) {
            target.textContent = text;
            setTimeout(() => {
                if (target.textContent === text) target.textContent = '';
            }, duration);
        }

        function setTeachMode(enabled) {
            teachToggle.checked = enabled;
            teachPanel.classList.toggle('hidden', !enabled);
            try { localStorage.setItem(TEACH_KEY, enabled ? '1' : '0'); } catch (e) { /* ignore */ }
        }

        // ---------- Events ----------

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(rephrasedText.textContent);
                copyButton.textContent = 'Copied';
            } catch (e) {
                copyButton.textContent = 'Copy failed';
            }
            setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
        });

        rephraseButton.addEventListener('click', async () => {
            const { feedback, instructions } = splitInstructions(inputTextarea.value.trim());

            if (instructions.length) {
                const added = addRules(instructions, 'note');
                inputTextarea.value = feedback;
                flash(inputStatus, added ? 'Rule saved. The model will always follow it.' : 'This rule is already saved.');
            }

            if (!feedback) {
                if (!instructions.length) {
                    showError('Please write the original feedback.');
                    rephrasedOutput.classList.add('hidden');
                }
                return;
            }

            rephraseButton.disabled = true;
            rephraseButton.textContent = 'Generating...';
            errorMessage.classList.add('hidden');
            rephrasedOutput.classList.add('hidden');

            try {
                const message = await generate(feedback);
                lastFeedback = feedback;
                lastGenerated = message;
                rephrasedText.textContent = message;
                expectedText.value = message;
                rephrasedOutput.classList.remove('hidden');
            } catch (e) {
                showError(e.message === 'UNRELIABLE_MESSAGE'
                    ? 'The generated message did not match the feedback, so it was not shown. Please click Generate again.'
                    : navigator.onLine
                    ? 'Please try again. Eng.Jana is upgrading it now'
                    : 'Unexpected error. Please check your internet connection and try again.');
            } finally {
                rephraseButton.disabled = false;
                rephraseButton.textContent = 'Generate another message';
            }
        });

        teachToggle.addEventListener('change', () => setTeachMode(teachToggle.checked));

        saveExampleButton.addEventListener('click', async () => {
            const corrected = expectedText.value.trim();

            if (!lastFeedback || !lastGenerated) {
                flash(teachStatus, 'Generate a message first.');
                return;
            }
            if (!corrected || normalizeArabic(corrected) === normalizeArabic(lastGenerated)) {
                flash(teachStatus, 'Edit the message first, then save.');
                return;
            }

            const key = normalizeArabic(lastFeedback);
            const examples = loadExamples().filter((ex) => normalizeArabic(ex.input) !== key);
            examples.unshift({
                input: lastFeedback,
                generated: lastGenerated,
                expected: corrected,
                createdAt: new Date().toISOString()
            });

            if (!saveExamples(examples)) {
                flash(teachStatus, 'Browser storage is unavailable.');
                return;
            }

            saveExampleButton.disabled = true;
            teachStatus.textContent = 'Learning from your edit...';

            try {
                const added = await learnFromCorrection(lastFeedback, lastGenerated, corrected);
                flash(teachStatus, added ? `Saved. Learned ${added} new rule${added === 1 ? '' : 's'}.` : 'Saved.');
            } catch (e) {
                flash(teachStatus, 'Saved. Rule extraction failed, the correction is still used.');
            } finally {
                saveExampleButton.disabled = false;
            }
        });

        let initialTeachMode = false;
        try { initialTeachMode = localStorage.getItem(TEACH_KEY) === '1'; } catch (e) { /* ignore */ }
        setTeachMode(initialTeachMode);
    });
    </script>
