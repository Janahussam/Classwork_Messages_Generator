        const BANNED_WORDS = [
            'وحش', 'بشع', 'فظيع', 'كارثة', 'مصيبة', 'زفت', 'زبالة', 'خرابيط', 'متخربط', 'مخربط',

            'تافه', 'سخيف', 'غبي', 'كسلان', 'كسولة', 'بايظ', 'خربان'
        ];

        const KEY_TERMS = [
            'نوت', 'notes', 'هيرو', 'hero', 'زيرو', 'zero', 'كلاس', 'class', 'مقالي', 'اختياري',
            'واجب', 'model', 'موديل', 'فيديو', 'دكتور', 'غلط', 'صح', 'ريفيجن', 'revision', 'مبعوت', 'كامل'
        ];

        const STOP_WORDS = new Set([
            'مش', 'انت', 'انتي', 'في', 'على', 'علي', 'من', 'عن', 'بس', 'كل', 'كله', 'كمان', 'هو', 'هي',
            'اللي', 'ده', 'دي', 'مع', 'او', 'لو', 'ما', 'لا', 'كاتب', 'كاتبه', 'محتاج', 'محتاجه', 'الطالب'
        ]);

        const inputTextarea = el('inputText');
        const inputStatus = el('inputStatus');
        const rephraseButton = el('rephraseButton');
        const rephrasedOutput = el('rephrased-output');
        const rephrasedText = el('rephrased-text');
        const errorMessage = el('error-message');
        const errorText = el('error-text');
        const copyButton = el('copyButton');
        const teachToggle = el('teachToggle');
        const teachPanel = el('teachPanel');
        const expectedText = el('expectedText');
        const saveExampleButton = el('saveExampleButton');
        const teachStatus = el('teachStatus');

        let lastFeedback = '';
        let lastGenerated = '';

        // ---------- Storage ----------

        function readList(key) {
            try {
                const parsed = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch (e) {
                return [];
            }
        }

        function writeList(key, list) {
            try {
                localStorage.setItem(key, JSON.stringify(list));
                return true;
            } catch (e) {
                return false;
            }
        }

        function isValidExample(item) {
            return item && typeof item.input === 'string' && typeof item.expected === 'string'
                && item.input.trim() && item.expected.trim();
        }

        function isValidRule(item) {
            return item && typeof item.text === 'string' && item.text.trim()
                && (item.source === 'note' || item.source === 'correction');
        }

        const loadExamples = () => readList(EXAMPLES_KEY).filter(isValidExample);
        const saveExamples = (list) => writeList(EXAMPLES_KEY, list);
        const loadRules = () => readList(RULES_KEY).filter(isValidRule);
        const saveRules = (list) => writeList(RULES_KEY, list);

        // Adds rules that are not already stored; learned rules are capped, team notes never expire.
        function addRules(texts, source) {
            const rules = loadRules();
            const known = new Set(rules.map((r) => normalizeArabic(r.text)));
            let added = 0;

            texts.map((t) => t.trim()).filter(Boolean).forEach((text) => {
                const key = normalizeArabic(text);
                if (!key || known.has(key)) return;
                known.add(key);
                rules.unshift({ text, source, createdAt: new Date().toISOString() });
                added += 1;
            });

            const notes = rules.filter((r) => r.source === 'note');
            const learned = rules.filter((r) => r.source === 'correction').slice(0, MAX_LEARNED_RULES);
            saveRules([...notes, ...learned]);
            return added;
        }

        // ---------- Text helpers ----------

        function normalizeArabic(text) {
            return text
                .toLowerCase()
                .replace(/[ً-ْـ]/g, '')
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/ى/g, 'ي')
                .replace(/ء/g, '')
                .replace(/[^\p{L}\p{N}\s]/gu, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function tokenize(text) {
            return new Set(normalizeArabic(text).split(' ').filter((t) => t.length > 1));
        }

        function keywords(text) {
            return [...tokenize(text)].filter((t) => t.length > 2 && !STOP_WORDS.has(t));
        }

        // Anything written between parentheses is an instruction to the model, not part of the feedback.
        function splitInstructions(text) {
            const instructions = [];
            const feedback = text
                .replace(/[(（]([^()（）]*)[)）]/g, (_, inner) => {
                    if (inner.trim()) instructions.push(inner.trim());
                    return ' ';
                })
                .replace(/\s+/g, ' ')
                .trim();
            return { feedback, instructions };
        }

        function similarity(a, b) {
            const ta = tokenize(a);
            const tb = tokenize(b);
            if (!ta.size || !tb.size) return 0;

            let shared = 0;
            ta.forEach((t) => { if (tb.has(t)) shared += 1; });
            const jaccard = shared / (ta.size + tb.size - shared);

            const na = normalizeArabic(a);
            const nb = normalizeArabic(b);
            const termHits = KEY_TERMS.filter((k) => na.includes(k) && nb.includes(k)).length;

            return jaccard + termHits * 0.05;
        }

        function pickExamples(feedback) {
            const saved = loadExamples();
            const pool = [...saved, ...BUILT_IN_EXAMPLES];

            const ranked = pool
                .map((ex, index) => ({ ex, score: similarity(feedback, ex.input), index }))
                .sort((x, y) => y.score - x.score || x.index - y.index);

            const picked = ranked.slice(0, MAX_PROMPT_EXAMPLES).map((r) => r.ex);

            // Keep the newest correction in context so it takes effect immediately.
            if (saved.length && !picked.includes(saved[0])) {
                picked[picked.length - 1] = saved[0];
            }
            return picked;
        }

        // ---------- Prompts ----------

        function formatExample(ex, index) {
            const lines = [`مثال ${index + 1}:`, `الملاحظة: ${ex.input.trim()}`];
            if (ex.generated && ex.generated.trim()) {
                lines.push(`رسالة اتكتبت قبل كده وكان فيها أخطاء (متكررهاش): ${ex.generated.trim()}`);
                lines.push(`نفس الرسالة بعد تصحيح فريق المتابعة (ده الصح): ${ex.expected.trim()}`);
            } else {
                lines.push(`الرسالة المعتمدة: ${ex.expected.trim()}`);
            }
            return lines.join('\n');
        }

        function formatRules() {
            const rules = loadRules();
            const notes = rules.filter((r) => r.source === 'note').map((r) => `• ${r.text}`);
            const learned = rules.filter((r) => r.source === 'correction').map((r) => `• ${r.text}`);
            const blocks = [];

            if (notes.length) {
                blocks.push(`تعليمات دائمة من فريق المتابعة (أولويتها أعلى من أي قاعدة تانية، ولازم تلتزم بيها في كل رسالة):\n${notes.join('\n')}`);
            }
            if (learned.length) {
                blocks.push(`دروس اتعلمتها من تصحيحات الفريق لرسايل قبل كده (متكررش نفس الأخطاء):\n${learned.join('\n')}`);
            }
            return blocks.join('\n\n');
        }

        function buildPrompt(feedback, examples, correction) {
            const examplesBlock = examples.map(formatExample).join('\n\n');
            const rulesBlock = formatRules();

            return `أنت عضو في فريق متابعة مادة الكيمياء لطلاب الثانوية العامة. بتاخد ملاحظة سريعة مكتوبة على الـ Class Work بتاع طالب أو طالبة (غالباً مختصرة وفيها أخطاء إملائية) وبتحولها لرسالة فيدباك بالعامية المصرية بتكلم الطالب نفسه مباشرة.
${rulesBlock ? `\n${rulesBlock}\n` : ''}
طريقة الشغل (اعملها جوه حقل points قبل ما تكتب الرسالة):
1. افهم الملاحظة وصحح أخطاءها الإملائية في دماغك. مثلاً: "نوتش هيرو اور زيرو" = Notes Hero or Zero، "تلمقالي" = "والمقالي"، "الاسءله" = "الأسئلة".
2. قسّم الملاحظة لنقط منفصلة، وحدد نوع كل نقطة: positive (حاجة اتعملت صح) أو needs_work (حاجة محتاجة تتحسن). الجملة الواحدة ممكن يطلع منها نقطتين، زي "بتحلي مع الدكتور برافو بس مش كاتب نوتس" = نقطة positive ونقطة needs_work.
3. حدد النوع من الملاحظة: لو فيها أي صيغة مؤنثة (انتي، بتحلي، كاتبة، عليكي...) يبقى female حتى لو في كلام بصيغة المذكر، غير كده male.

قواعد الرسالة:
1. كل نقطة في الملاحظة لازم تظهر في الرسالة بنفس معناها بالظبط، من غير ما تحذف نقطة أو تدمج نقطتين لحد ما واحدة تضيع، ومن غير ما تضيف مشكلة أو مدح مش موجودين. لو في رقم أو كمية (زي "سؤالين تلاتة") وضّحه.
2. المدح للنقط الـ positive بس، ويكون مدح محدد للحاجة نفسها. ممنوع تقول "كملي كده" أو "استمر" أو تمدح بعد نقطة needs_work مباشرة كأنها حاجة كويسة.
3. أهم قاعدة: ممنوع تتجاهل أي نقطة needs_work أو تكتفي بالمدح. بعد التشجيع مباشرة لازم تقول كل نقطة needs_work بالاسم (مثلاً "بس محتاج تكتب Notes Hero or Zero")، وبعدها على طول نصيحة حقيقية من 2 لـ 3 جمل فيها:
   أ. تعمل إيه بالظبط، وإمتى، وإزاي (خطوة عملية تقدر تنفذها في الـ Class Work الجاي).
   ب. ليه ده هيفرق معاك فعلاً (في الفهم، في حل الأسئلة الصعبة، في الـ Revision، أو في الامتحان).
   ممنوع النصيحة تبقى جملة عامة زي "لأنها مهمة جدًا" أو "حاول تركز أكتر" من غير تفاصيل. استخدم دليل النصايح تحت (ده كلام فريق المتابعة نفسه) كأساس، وصيغه بكلامك وعلى حسب تفاصيل الملاحظة. اكتب النصيحة في حقل advice للنقطة، ولازم نفس النصيحة تظهر كاملة جوه الرسالة.
4. حافظ على المصطلحات واكتبها بالشكل المعتمد: Class Work، Notes، Notes Hero or Zero، Revision، Approach، المقالي، الاختياري، الواجب. ممنوع تبدلها بكلمة عامة زي "الشغل" أو "المذاكرة"، وممنوع تذكر جزء مش مذكور في الملاحظة. "Class Work" دايماً مفرد.
5. الـ Class Work ملوش Model Answer: الطالب بيقرا السؤال ويفكر فيه، وبعدين يشوف حل الدكتور في الفيديو ويكتب النوتس. ممنوع تذكر الـ Model Answer أو تنصح بيه في أي كلام عن الـ Class Work. الـ Model Answer للواجب بس، ويتذكر بس لو الملاحظة بتتكلم عن الواجب.
6. ممنوع أي حكم سلبي على الطالب أو شغله (وحش، مهمل، كسلان، عشوائي، مبهدل، مش مرتب...)، حتى لو مكتوب في الملاحظة. حوّله لوصف للي محتاج يتعمل.
7. ابدأ على طول من غير ترحيب. لو في نقطة positive ابدأ بمدحها تحديداً. لو مفيش ولا نقطة positive، متمدحش حاجة مش موجودة، وابدأ بتقدير اهتمامك إنه بعت الـ Class Work.
8. الترتيب: أول رد على مجهوده والنقط الـ positive قبل أي غلط، بعدين النقط اللي محتاجة تتحسن ومعاها النصيحة وسببها. كل نقطة needs_work لازم تتذكر، لكن النصيحة المفصلة تكون لأهم نقطة أو اتنين بس، والباقي يتقال باختصار، علشان الطالب ميحسش إن كل حاجة غلط. اقفل بالحاجة اللي هنستناها منه في الـ Class Work الجاي، زي "مستنيين النوتس المرة الجاية"، ومعاها جملة ثقة بضمير "إحنا" لو مناسب. نوّع صياغة البداية والختام كل مرة.
9. الرسالة كلها كلام موجه للطالب نفسه بضمير المخاطب (انت/انتي) وبالنوع الصح، من أول كلمة لآخر كلمة. ممنوع تتكلم عنه بصيغة الغائب، يعني ممنوع "الطالب" أو "هو بيحل" أو "هي كاتبة". دليل النصايح مكتوب بالمخاطب المذكر، فحوّله للنوع الصح.
10. فقرة واحدة (أو اتنين بالكتير) متصلة، من غير شرطة (-) أو ترقيم أو عناوين أو كل جملة في سطر.
11. نبرة دافية وبسيطة: مسموح "برافو عليك/عليكي" و"يا شاطر/يا شاطرة" و ❤️ مرة أو مرتين بالكتير. خد من الأمثلة المعتمدة الأسلوب، لكن جزء النصيحة ممكن يبقى أطول منها عشان يبقى كافي، من غير رغي زيادة.

الأمثلة (كاتبها أو مصححها فريق المتابعة نفسه. لما يكون في رسالة فيها أخطاء وتصحيحها، افهم إيه اللي اتغير وليه، وطبّق ده على أي رسالة جاية. قلّد الأسلوب، ومتنسخش الجمل لو الملاحظة مختلفة):
${examplesBlock}

دليل النصايح (لكل مشكلة متكررة: تعمل إيه وليه):
${ADVICE_GUIDE}

المرجع (نظام الـ Class Work وأهميته، استخدم منه فكرة لما تكون مرتبطة بنقطة needs_work):
${CLASSWORK_GUIDE}
${correction ? `\nتنبيه: محاولة سابقة طلعت فيها المشكلة دي: ${correction}. اكتب الرسالة تاني وتجنبها.\n` : ''}
رجّع JSON بس بالشكل ده من غير أي كلام تاني:
{"gender": "female أو male", "points": [{"text": "النقطة", "type": "positive أو needs_work", "advice": "النصيحة والسبب (للـ needs_work بس، وفاضي للـ positive)"}], "message": "الرسالة النهائية"}

الملاحظة: ${feedback}`;
        }

        function buildLessonPrompt(feedback, generated, corrected) {
            return `أنت بتراجع رسايل فيدباك لطلاب الكيمياء (ثانوية عامة) بيكتبها موديل AI. فريق المتابعة صحح رسالة كتبها الموديل.

الملاحظة الأصلية: ${feedback}
الرسالة اللي كتبها الموديل: ${generated}
الرسالة بعد تصحيح الفريق: ${corrected}

قارن الرسالتين وطلّع من 1 لـ 3 قواعد عامة تمنع الموديل يكرر نفس الأخطاء في أي رسالة جاية. كل قاعدة جملة واحدة واضحة بالعامية المصرية بتقول يعمل إيه أو ميعملش إيه. القاعدة تكون عامة ومش خاصة بالطالب ده أو بالملاحظة دي بالذات. لو الفرق مجرد إعادة صياغة من غير معنى جديد، رجّع لستة فاضية.

رجّع JSON بس بالشكل ده:
{"lessons": ["القاعدة الأولى", "القاعدة التانية"]}`;
        }

        // ---------- Response parsing and checks ----------

        function stripFences(rawText) {
            return rawText.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
        }

        function parseJson(rawText) {
            const cleaned = stripFences(rawText);
            const candidates = [cleaned, (cleaned.match(/\{[\s\S]*\}/) || [])[0]].filter(Boolean);
            for (const candidate of candidates) {
                try {
                    return JSON.parse(candidate);
                } catch (e) {
                    // Fall through to the next candidate.
                }
            }
            return null;
        }

        // Returns null when the response is missing or was cut off mid-generation.
        function parseMessage(rawText) {
            const data = parseJson(rawText);
            if (data && typeof data.message === 'string' && data.message.trim()) {
                return { message: data.message.trim(), points: Array.isArray(data.points) ? data.points : [] };
            }
            const cleaned = stripFences(rawText);
            if (!cleaned || cleaned.startsWith('{')) return null;
            return { message: cleaned, points: [] };
        }

        function parseLessons(rawText) {
            const data = parseJson(rawText);
            if (!data || !Array.isArray(data.lessons)) return null;
            return data.lessons.filter((l) => typeof l === 'string' && l.trim()).slice(0, 3);
        }

        function findIssue(message, points, feedback) {
            if (/^\s*[-•*]/m.test(message)) return 'في سطر بادئ بشرطة أو نقطة';
            if (/كلاسوركات|class works/i.test(message)) return 'كلمة Class Work اتجمعت';

            const normalized = normalizeArabic(message);
            const hit = BANNED_WORDS.find((w) => normalized.includes(normalizeArabic(w)));
            if (hit) return `استخدمت كلمة فيها حكم سلبي ("${hit}")`;

            if (/(^| )(الطالب|الطالبه|للطالب|للطالبه)( |$)/.test(normalized)) {
                return 'الرسالة بتتكلم عن الطالب بصيغة الغائب بدل ما تكلمه هو مباشرة';
            }

            const aboutHomework = /(واجب|هوم ?ورك|homework)/i.test(normalizeArabic(feedback));
            if (!aboutHomework && /(model answer|موديل ا?نسر)/i.test(normalized)) {
                return 'ذكرت الـ Model Answer، والـ Class Work ملوش Model Answer';
            }

            const pending = points.filter((p) => p && p.type === 'needs_work' && typeof p.text === 'string');
            for (const point of pending) {
                const words = keywords(point.text);
                if (words.length && !words.some((w) => normalized.includes(w))) {
                    return `الرسالة مذكرتش النقطة اللي محتاجة تتحسن: "${point.text}"`;
                }
            }
            if (pending.length && !/(لان|عشان|علشان|هيساعد|هيفرق|هتفرق|مهم|هتفهم|هيخليك|هيخليكي)/.test(normalized)) {
                return 'الرسالة مفيهاش نصيحة أو سبب للنقطة اللي محتاجة تتحسن';
            }
            const wordCount = (text) => normalizeArabic(text || '').split(' ').filter(Boolean).length;
            if (pending.length && !pending.some((p) => wordCount(p.advice) >= 15)) {
                return 'النصيحة قصيرة وعامة، لازم أهم نقطة يتقال فيها تعمل إيه بالظبط وإزاي وليه ده هيفرق معاك';
            }
            return '';
        }

        // ---------- Model calls ----------

        async function callModel(model, prompt, temperature) {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model,
                    contents: [{ role: 'user', parts: [{ text: prompt }] }],
                    generationConfig: {
                        temperature,
                        topP: 0.95,
                        maxOutputTokens: 4096,
                        responseMimeType: 'application/json'
                    }
                })
            });

            if (!response.ok) {
                throw new Error(`${model} failed with status ${response.status}`);
            }

            const result = await response.json();
            const candidate = result?.candidates?.[0];
            if (candidate?.finishReason === 'MAX_TOKENS') {
                throw new Error(`${model} response was truncated`);
            }

            return candidate?.content?.parts
                ?.filter((p) => !p.thought)
                .map((p) => p.text || '')
                .join('') || '';
        }

        // Walks the model list from `startIndex` until one returns a parseable answer.
        async function requestWithFallback(prompt, parse, { startIndex = 0, temperature = 0.8 } = {}) {
            let lastError;
            for (let i = startIndex; i < MODELS.length; i += 1) {
                try {
                    const parsed = parse(await callModel(MODELS[i], prompt, temperature));
                    if (parsed) return { ...parsed, modelIndex: i };
                    lastError = new Error(`${MODELS[i]} returned an empty or incomplete response`);
                } catch (e) {
                    lastError = e;
                }
                console.warn(lastError.message);
            }
            throw lastError || new Error('No model available');
        }

        async function generate(feedback) {
            const examples = pickExamples(feedback);
            let result = await requestWithFallback(buildPrompt(feedback, examples), parseMessage);

            let issue = findIssue(result.message, result.points, feedback);
            for (let attempt = 0; issue && attempt < 2; attempt += 1) {
                try {
                    const retry = await requestWithFallback(
                        buildPrompt(feedback, examples, issue),
                        parseMessage,
                        { startIndex: result.modelIndex }
                    );
                    const retryIssue = findIssue(retry.message, retry.points, feedback);
                    if (!retryIssue) {
                        result = retry;
                        break;
                    }
                    issue = retryIssue;
                } catch (e) {
                    break;
                }
            }
            return result.message;
        }

        async function learnFromCorrection(feedback, generated, corrected) {
            const { lessons } = await requestWithFallback(
                buildLessonPrompt(feedback, generated, corrected),
                (text) => {
                    const parsed = parseLessons(text);
                    return parsed ? { lessons: parsed } : null;
                },
                { temperature: 0.2 }
            );
            return addRules(lessons, 'correction');
        }

        // ---------- UI helpers ----------

        function showError(text) {
            errorMessage.classList.remove('hidden');
            errorText.textContent = text;
        }

        function flash(target, text, duration = 3000) {
            target.textContent = text;
            setTimeout(() => {
                if (target.textContent === text) target.textContent = '';
            }, duration);
        }

        function setTeachMode(enabled) {
            teachToggle.checked = enabled;
            teachPanel.classList.toggle('hidden', !enabled);
            try { localStorage.setItem(TEACH_KEY, enabled ? '1' : '0'); } catch (e) { /* ignore */ }
        }

        // ---------- Events ----------

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(rephrasedText.textContent);
                copyButton.textContent = 'Copied';
            } catch (e) {
                copyButton.textContent = 'Copy failed';
            }
            setTimeout(() => { copyButton.textContent = 'Copy'; }, 1500);
        });

        rephraseButton.addEventListener('click', async () => {
            const { feedback, instructions } = splitInstructions(inputTextarea.value.trim());

            if (instructions.length) {
                const added = addRules(instructions, 'note');
                inputTextarea.value = feedback;
                flash(inputStatus, added ? 'Rule saved. The model will always follow it.' : 'This rule is already saved.');
            }

            if (!feedback) {
                if (!instructions.length) {
                    showError('Please write the original feedback.');
                    rephrasedOutput.classList.add('hidden');
                }
                return;
            }

            rephraseButton.disabled = true;
            rephraseButton.textContent = 'Generating...';
            errorMessage.classList.add('hidden');
            rephrasedOutput.classList.add('hidden');

            try {
                const message = await generate(feedback);
                lastFeedback = feedback;
                lastGenerated = message;
                rephrasedText.textContent = message;
                expectedText.value = message;
                rephrasedOutput.classList.remove('hidden');
            } catch (e) {
                showError(navigator.onLine
                    ? 'Please try again. Eng.Jana is upgrading it now'
                    : 'Unexpected error. Please check your internet connection and try again.');
            } finally {
                rephraseButton.disabled = false;
                rephraseButton.textContent = 'Generate another message';
            }
        });

        teachToggle.addEventListener('change', () => setTeachMode(teachToggle.checked));

        saveExampleButton.addEventListener('click', async () => {
            const corrected = expectedText.value.trim();

            if (!lastFeedback || !lastGenerated) {
                flash(teachStatus, 'Generate a message first.');
                return;
            }
            if (!corrected || normalizeArabic(corrected) === normalizeArabic(lastGenerated)) {
                flash(teachStatus, 'Edit the message first, then save.');
                return;
            }

            const key = normalizeArabic(lastFeedback);
            const examples = loadExamples().filter((ex) => normalizeArabic(ex.input) !== key);
            examples.unshift({
                input: lastFeedback,
                generated: lastGenerated,
                expected: corrected,
                createdAt: new Date().toISOString()
            });

            if (!saveExamples(examples)) {
                flash(teachStatus, 'Browser storage is unavailable.');
                return;
            }

            saveExampleButton.disabled = true;
            teachStatus.textContent = 'Learning from your edit...';

            try {
                const added = await learnFromCorrection(lastFeedback, lastGenerated, corrected);
                flash(teachStatus, added ? `Saved. Learned ${added} new rule${added === 1 ? '' : 's'}.` : 'Saved.');
            } catch (e) {
                flash(teachStatus, 'Saved. Rule extraction failed, the correction is still used.');
            } finally {
                saveExampleButton.disabled = false;
            }
        });

        let initialTeachMode = false;
        try { initialTeachMode = localStorage.getItem(TEACH_KEY) === '1'; } catch (e) { /* ignore */ }
        setTeachMode(initialTeachMode);
    });
    </script>
</body>
</html>
